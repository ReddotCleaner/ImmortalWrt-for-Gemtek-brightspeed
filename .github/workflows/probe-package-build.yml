name: Probe package build

# Isolated diagnostic: configure the target, build the kernel, then compile one
# package with V=s so the exact compiler error lands in the uploaded logs.
# Dispatched by hand only.

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Package path relative to repo root'
        required: true
        default: 'package/kernel/airoha-i2c'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make u-boot-tools squashfs-tools

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Configure
        run: |
          cp 1710.config .config
          make defconfig
          grep -qE '^CONFIG_PACKAGE_kmod-airoha-i2c=[ym]$' .config || {
            echo "::error::kmod-airoha-i2c missing from .config"
            exit 1
          }
          grep -E '^CONFIG_PACKAGE_kmod-airoha-i2c=' .config

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build toolchain and kernel
        run: |
          # Canonical order: building one deep target with -j lets host tools
          # race their own consumers (Error 127 creating private-key.pem / lua
          # host .configured), so install tools and toolchain first.
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install
          make -j$(nproc) package/kernel/linux/compile V=s

      - name: Compile the package (verbose)
        run: |
          set -o pipefail
          make '${{ inputs.package_path }}/compile' V=s -j1 2>&1 | tee /tmp/pkg.log
          echo "=== package build OK ==="

      - name: Dump package log
        if: always()
        run: |
          echo "=== /tmp/pkg.log tail ==="
          tail -80 /tmp/pkg.log 2>/dev/null || true
          for f in logs/package/*/*/compile.txt; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -60 "$f"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs
          path: |
            logs/
            /tmp/pkg.log
          if-no-files-found: warn
          retention-days: 14
