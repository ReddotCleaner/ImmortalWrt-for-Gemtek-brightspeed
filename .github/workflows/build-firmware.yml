name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      config_seed:
        description: 'Build config'
        required: true
        default: '1710.config'
        type: choice
        options:
          - 1710.config
          - 2010.config
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=8 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=8 "$upstream_base")
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          # 文件名只保留 “日期-本机commit”，完整 build_id 落到 VERSION_CODE
          version_number="${build_date}-${repo_commit}"
          version_code="${build_id}"

          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "version_code=$version_code" >> $GITHUB_OUTPUT
          case '${{ inputs.config_seed }}' in
            1710.config) device_model=XR1710G ;;
            2010.config) device_model=XG2010G ;;
            *) echo "Unsupported config seed: ${{ inputs.config_seed }}" >&2; exit 1 ;;
          esac
          echo "device_model=$device_model" >> $GITHUB_OUTPUT
          echo "Build version: ImmortalWrt-for-Gemtek-brightspeed $device_model $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          cp '${{ inputs.config_seed }}' .config
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          VERSION_CODE='${{ steps.version.outputs.version_code }}' \
          bash scripts/set-build-version.sh .config
          make defconfig
          bash scripts/check-gemtek-profile-isolation.sh --config .config
          grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_NUMBER|VERSION_CODE|VERSION_FILENAMES|VERSION_CODE_FILENAMES)[= ]' .config

      - name: Report lean config
        shell: bash
        run: |
          echo "=== image packages (=y): $(grep -c '^CONFIG_PACKAGE_.*=y$' .config || true) ==="
          echo "=== offline-repo packages (=m): $(grep -c '^CONFIG_PACKAGE_.*=m$' .config || true) ==="
          watch="luci-app-lucky luci-app-zerotier luci-app-ddns-go luci-app-ddns luci-app-upnp luci-app-arpbind luci-app-msd_lite luci-app-autoreboot luci-app-timewol luci-app-wifischedule luci-app-watchcat luci-app-wol luci-app-vlmcsd luci-app-rtp2httpd luci-app-udpxy lucky zerotier ddns-go ddns-scripts miniupnpd-nftables libminiupnpc msd_lite rtp2httpd udpxy vlmcsd watchcat smartdns smartdns-ui xray-core simple-obfs-client chinadns-ng geoview dns2socks microsocks ipt2socks igmpproxy luci-theme-argon"
          pulled=""
          for p in $watch; do
            if grep -qx "CONFIG_PACKAGE_$p=y" .config; then pulled="$pulled $p"; fi
          done
          if [ -n "$pulled" ]; then
            echo "::warning::these were pulled back into the image (=y) by defconfig/watchdog deps:$pulled"
          else
            echo "lean profile clean: none of the trimmed packages are =y"
          fi
          echo "=== wireguard/kmod state ==="
          grep -E '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|rpcd-mod-wireguard|xray-core|luci-theme-argon|luci-theme-bootstrap)=' .config || true

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build Firmware
        shell: bash
        run: |
          make -j2 world 2>&1 | tee build.log

      - name: Build offline package repo
        if: success()
        shell: bash
        run: |
          make package/index V=s 2>&1 | tail -20 || true
          echo "=== bin/packages layout (depth 4) ==="
          find bin/packages -maxdepth 4 -type d 2>/dev/null | sort || true
          echo "=== index files ==="
          find bin/packages -maxdepth 5 -type f \( -name 'packages.adb*' -o -name 'Packages*' \) 2>/dev/null | sort || true
          echo "=== package count ==="
          find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) 2>/dev/null | wc -l
          du -sh bin/packages 2>/dev/null || true

      - name: Pack offline package repo
        if: success()
        shell: bash
        run: |
          rm -rf /tmp/offline
          mkdir -p /tmp/offline/packages /tmp/offline/target-packages
          cp -a bin/packages/. /tmp/offline/packages/
          if [ -d bin/targets/airoha/an7581/packages ]; then
            cp -a bin/targets/airoha/an7581/packages/. /tmp/offline/target-packages/
          fi
          echo "=== offline repo layout ==="
          find /tmp/offline -maxdepth 3 -type d | sort
          echo "userspace apk: $(find /tmp/offline/packages -name '*.apk' | wc -l)"
          echo "kmod/target apk: $(find /tmp/offline/target-packages -name '*.apk' | wc -l)"
          find /tmp/offline/target-packages -name 'kmod-*.apk' | sort | head -40
          {
            echo "ImmortalWrt-for-Gemtek-brightspeed  offline package repository"
            echo "target : airoha/an7581    config: ${{ inputs.config_seed }}"
            echo "build  : ${{ steps.version.outputs.build_id }}"
            echo
            echo "packages/        = userspace packages (base / luci / packages feeds)"
            echo "target-packages/ = kernel modules and target packages (kmod-*, ...)"
            echo
            echo "这些包与随包发布的固件用的是同一棵源码树、同一个内核, vermagic 严格匹配, 可随时补装。"
            echo "官方 snapshot 源上的 kmod-* 与本固件内核不一致, 装不上, 请用本仓库里的包。"
            echo
            echo "用法 (在设备上执行):"
            echo "  tar -xzf gemtek-offline-packages.tar.gz -C /tmp"
            echo "  mkdir -p /etc/apk/repositories.d"
            echo "  { find /tmp/packages -mindepth 2 -maxdepth 2 -type d; [ -d /tmp/target-packages ] && echo /tmp/target-packages; } | sort > /etc/apk/repositories.d/offline.list"
            echo "  apk update"
            echo
            echo "  # 例: 装回 argon 主题 (装回去它会把默认主题重新设为 argon)"
            echo "  apk add luci-theme-argon"
            echo "  # 例: 装回 WireGuard"
            echo "  apk add kmod-wireguard wireguard-tools luci-proto-wireguard rpcd-mod-wireguard"
            echo "  # 例: 装回 xray-core (含 tproxy 内核模块)"
            echo "  apk add xray-core simple-obfs-client kmod-nf-tproxy kmod-nft-tproxy"
            echo
            echo "只装单个 apk 文件:"
            echo "  apk add --allow-untrusted /tmp/packages/<arch>/<feed>/xxx.apk"
          } > /tmp/offline/README.txt
          tar -czf gemtek-offline-packages.tar.gz -C /tmp/offline .
          ls -la gemtek-offline-packages.tar.gz

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          failed_pkg=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          if [ -n "$failed_pkg" ]; then
            echo "=== Rebuilding $failed_pkg with V=s ==="
            make "package/$failed_pkg/compile" V=s -j1 2>&1 | tee build-verbose.log || true
            echo "=== First errors in build-verbose.log ==="
            grep -nE "error:|Error [0-9]|FAILED|Patch failed|No rule to make target" build-verbose.log | head -40 || true
            echo "=== tail of build-verbose.log ==="
            tail -80 build-verbose.log || true
          else
            echo "No failing package found in build.log" >&2
            tail -150 build.log || true
          fi

      - name: Verify device isolation
        shell: bash
        run: |
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          manifest=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*manifest' -print -quit)
          test -n "$kernel_config"
          test -n "$manifest"
          bash scripts/check-gemtek-profile-isolation.sh \
            --config .config \
            --kernel-config "$kernel_config" \
            --manifest "$manifest"

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gemtek-${{ inputs.config_seed }}-firmware
          path: |
            build.log
            build-verbose.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Upload offline package repository
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: gemtek-${{ inputs.config_seed }}-offline-packages
          path: gemtek-offline-packages.tar.gz
          retention-days: 90

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          name: ${{ format('{0} - Gemtek {1} Build ({2})', steps.version.outputs.date, steps.version.outputs.device_model, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
            gemtek-offline-packages.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# fork-enabled
